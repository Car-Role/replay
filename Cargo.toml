[package]
name = "replay"
version = "0.1.0"
edition = "2024"
description = "Low-overhead instant replay clipping for Windows, built on NVENC"
license = "MIT"
publish = false

[dev-dependencies]
minisign = "0.10"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
log = "0.4"
minisign-verify = "0.3"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(unix)'.dependencies]
arboard = { version = "3", default-features = false }
cpal = "0.18"
dirs = "7"
global-hotkey = "0.9"
keyring = "4"
libc = "0.2"
notify-rust = "4"
symphonia = { version = "0.5", default-features = false, features = ["aac"] }
tao = "0.37"
tray-icon = "0.26"
ureq = "3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-audio-toolbox = "0.3"
objc2-av-foundation = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinHttp",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [".", "tools/icongen", "tools/sign"]
