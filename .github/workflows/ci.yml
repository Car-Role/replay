name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev \
            libdbus-1-dev libx11-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --locked -p replay
      - name: Test
        run: cargo test --locked -p replay
      - name: Clippy
        run: cargo clippy --locked -p replay --all-targets
