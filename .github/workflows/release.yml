name: Release

# Push a tag like v0.1.0 to build, sign and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag $tag does not match Cargo.toml version $ver" }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: cargo test --locked --release -p replay

      - name: Build
        run: cargo build --locked --release -p replay

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/release/replay.exe dist/stage/replay.exe
          Copy-Item LICENSE dist/stage/LICENSE.txt
          Copy-Item README.md dist/stage/README.md
          # Program file the auto-updater downloads.
          Copy-Item target/release/replay.exe dist/replay-windows-x64.exe
          # Portable zip.
          Compress-Archive -Path dist/stage/* -DestinationPath dist/replay-windows-x64.zip
          # Installer.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\dist\stage" installer\replay.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Checksums
        shell: pwsh
        run: |
          $files = "Replay-Setup-windows-x64.exe", "replay-windows-x64.zip", "replay-windows-x64.exe"
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 "dist/$f").Hash.ToLower()
            "$h  $f"
          }
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      - name: Sign checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: cargo run --locked --release -p sign -- sign dist/SHA256SUMS.txt

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Download

          - **[Replay-Setup-windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Replay-Setup-windows-x64.exe)**: installer (recommended, no admin rights needed)
          - [replay-windows-x64.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/replay-windows-x64.zip): portable

          Windows 10 2004 or later. An NVIDIA, AMD or Intel GPU with a hardware video encoder.

          Replay is not code-signed yet, so Windows SmartScreen may warn on first start: choose **More info**, then **Run anyway**.
          ``SHA256SUMS.txt`` lists every file's hash and is signed with the release key in ``assets/replay-update.pub`` (minisign).
          "@
          gh release create "${{ github.ref_name }}" dist/Replay-Setup-windows-x64.exe dist/replay-windows-x64.zip dist/replay-windows-x64.exe dist/SHA256SUMS.txt dist/SHA256SUMS.txt.minisig --title "Replay $env:VERSION" --notes $notes --generate-notes
